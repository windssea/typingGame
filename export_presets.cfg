[preset.0]
name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json,assets/generated/regions.json,assets/OFL-NotoSansSC.txt"
exclude_filter="docs/*,tests/*,tools/*,build/*,assets/design-v2/*,assets/animation-sources/*,assets/animations/boxing-blue-idle-v001/*,assets/animations/boxing-blue-punch-v001/*,assets/animations/boxing-blue-punch-v002/*,assets/animations/mole-idle-v08/*,assets/animations/mole-hit-v08/*,assets/animations/ufo-idle-v08/*,assets/animations/ufo-hit-v08/*,assets/animations/rally-drive-v08/*,assets/animations/rally-boost-v08/*,assets/animations/goblin-walk-v08/*,assets/animations/goblin-hit-v08/*,assets/*-source.ttf,addons/*"
export_path="build/web/index.html"
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"theme-color\" content=\"#f4f9fd\">"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
